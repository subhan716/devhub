<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="description" content="DevHub is the ultimate professional network for developers. Connect with elite engineers, showcase your code, and build your portfolio." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevHub - The Professional Developer Network</title>
    
    <!-- Zero-Flicker Theme Initialization Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('devhub_theme');
          var isDark = saved === 'dark' || !saved;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
